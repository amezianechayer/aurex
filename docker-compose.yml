version: '3.8'

volumes:
  postgres:

services:
  postgres:
    image: "postgres:13-alpine"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: "ledger"
      POSTGRES_PASSWORD: "ledger"
      POSTGRES_DB: "ledger"
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres

  corren:
    image: "ghcr.io/amezianechayer/corren:latest"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3068/_info"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3068:3068"
    environment:
      CORREN_STORAGE_DRIVER: "postgres"
      CORREN_STORAGE_POSTGRES_CONN_STRING: "postgresql://ledger:ledger@postgres/ledger"
      CORREN_SERVER_HTTP_BIND_ADDRESS: "0.0.0.0:3068"

  horizon:
    image: "ghcr.io/amezianechayer/corren:latest"
    command: corren ui
    depends_on:
      corren:
        condition: service_healthy
    ports:
      - "3078:3078"
    environment:
      CORREN_UI_HTTP_BIND_ADDRESS: "0.0.0.0:3078"
on:
  push:
    branches:
      - main

name: Main

jobs:
  build_horizon:
    name: 'Build Horizon'
    runs-on: ubuntu-latest

    steps:
      - name: Get latest release of Horizon
        uses: rez0n/actions-github-release@main
        id: horizon_release
        with:
          token: ${{ secrets.GH_PAT }}
          repository: "amezianechayer/horizon"
          type: "stable"

      - run: curl -OL ${{ steps.horizon_release.outputs.browser_download_url }}
      - run: tar -zxvf horizon-${{ steps.horizon_release.outputs.release }}.tar.gz
      - run: rm -rf horizon-${{ steps.horizon_release.outputs.release }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-dist
          path: ./**

  build:
    name: 'Build'
    needs: build_horizon
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        include:
          - os: windows-latest
            file: windows
          - os: ubuntu-latest
            file: default

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.18'

      - uses: actions/checkout@v4

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Fetch Horizon dist
        uses: actions/download-artifact@v4
        with:
          name: horizon-dist
          path: cmd/horizon/

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: get deps
        run: go get
        env:
          CGO_ENABLED: 1
          GOPRIVATE: github.com/amezianechayer/*
          GONOSUMCHECK: github.com/amezianechayer/*
          GONOSUMDB: github.com/amezianechayer/*

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v2
        with:
          version: latest
          args: build --parallelism 4 --rm-dist --skip-validate --snapshot --config .github/.goreleaser.${{matrix.file}}.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GOPRIVATE: github.com/amezianechayer/*
          GONOSUMCHECK: github.com/amezianechayer/*
          GONOSUMDB: github.com/amezianechayer/*